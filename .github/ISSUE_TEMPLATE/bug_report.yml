name: 🐛 Bug 报告
description: 报告一个 Bug，帮助改进 TokenBoard
title: "[Bug] "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        感谢你花时间报告 Bug！请尽量提供完整信息，方便快速定位问题。
  - type: textarea
    id: description
    attributes:
      label: 问题描述
      description: 清楚简洁地描述这个 Bug 是什么
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: 复现步骤
      description: 如何复现这个问题？
      placeholder: |
        1. 打开 TokenBoard
        2. 点击菜单栏图标 → 设置
        3. 粘贴 Cookie 并保存
        4. 观察到 ...
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: 期望行为
      description: 你期望发生什么？
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: 实际行为
      description: 实际发生了什么？如有报错信息请一并贴出
    validations:
      required: true
  - type: dropdown
    id: macos
    attributes:
      label: macOS 版本
      options:
        - macOS 15 Sequoia
        - macOS 14 Sonoma
        - macOS 13 Ventura
        - 其他 / 不确定
    validations:
      required: true
  - type: dropdown
    id: chip
    attributes:
      label: 芯片架构
      options:
        - Apple Silicon (M1/M2/M3/M4)
        - Intel
        - 不确定
    validations:
      required: true
  - type: dropdown
    id: version
    attributes:
      label: TokenBoard 版本
      options:
        - v0.1.0
        - 源码构建（main 分支）
        - 其他
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: 相关日志
      description: 如有系统日志（Console.app）或崩溃报告，请粘贴关键片段
      render: shell
  - type: textarea
    id: context
    attributes:
      label: 补充信息
      description: 截图、录屏或其他有助于排查的信息
