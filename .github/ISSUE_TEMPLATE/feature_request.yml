name: ✨ 功能建议
description: 提出一个新功能或改进想法
title: "[Feature] "
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        感谢你提出功能建议！请描述清楚你想要什么以及为什么。
  - type: textarea
    id: problem
    attributes:
      label: 解决的痛点
      description: 你想解决什么问题？当前的使用场景是什么？
      placeholder: 我在使用 TokenBoard 时，经常需要 ...
    validations:
      required: true
  - type: textarea
    id: solution
    attributes:
      label: 期望的方案
      description: 描述你期望的功能表现（越具体越好）
      placeholder: 希望菜单栏能显示 ...
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: 备选方案
      description: 有没有考虑过其他实现方式？
    validations:
      required: false
  - type: textarea
    id: mockup
    attributes:
      label: 示意图 / 线框
      description: 如有界面草图、示意图，可在这里粘贴或描述
    validations:
      required: false
