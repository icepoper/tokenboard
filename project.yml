name: TokenBoard
options:
  bundleIdPrefix: com.tokenboard
  deploymentTarget:
    macOS: "13.0"
  xcodeVersion: "15.0"
  createIntermediateGroups: true
  developmentLanguage: zh-Hans

settings:
  base:
    SWIFT_VERSION: "5.9"
    MACOSX_DEPLOYMENT_TARGET: "13.0"
    CODE_SIGN_IDENTITY: "-"
    ENABLE_HARDENED_RUNTIME: NO
    GENERATE_INFOPLIST_FILE: YES
    DEVELOPMENT_LANGUAGE: zh-Hans

targets:
  TokenBoard:
    type: application
    platform: macOS
    sources:
      - path: TokenBoard
      - path: TokenBoard/Assets.xcassets
      - path: TokenBoard/Resources
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.tokenboard.app
        MARKETING_VERSION: "0.1.5"
        CURRENT_PROJECT_VERSION: "9"
        INFOPLIST_KEY_LSUIElement: YES
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        INFOPLIST_KEY_NSHumanReadableCopyright: ""
        INFOPLIST_KEY_NSAppTransportSecurity_NSAllowsArbitraryLoads: NO
        ENABLE_PREVIEWS: YES
        COMBINE_HIDPI_IMAGES: YES
        LD_RUNPATH_SEARCH_PATHS:
          - "$(inherited)"
          - "@executable_path/../Frameworks"
    entitlements:
      path: TokenBoard/TokenBoard.entitlements
      properties:
        com.apple.security.app-sandbox: false

  TokenBoardTests:
    type: bundle.unit-test
    platform: macOS
    sources:
      - path: TokenBoardTests
    dependencies:
      - target: TokenBoard
